<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MEDGUARD AI – Live Demo</title>
<style>
:root{--bg:#0a1020;--card:#131f38;--bd:#24385c;--tx:#e8eef9;--mu:#a9b8d2;--cy:#22d3ee;--gr:#4ade80;--rd:#ff5c7a;--am:#fbbf24;--ink:#0a1020;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef3fb;--card:#fff;--bd:#c6d3e8;--tx:#10203a;--mu:#4a5d7c;--cy:#0b7fa0;--gr:#16803c;--rd:#c8203f;--am:#a86a00;--ink:#fff}}
:root[data-theme="dark"]{--bg:#0a1020;--card:#131f38;--bd:#24385c;--tx:#e8eef9;--mu:#a9b8d2;--cy:#22d3ee;--gr:#4ade80;--rd:#ff5c7a;--am:#fbbf24;--ink:#0a1020}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Space Grotesk',system-ui,Arial,sans-serif;font-size:16px;line-height:1.45}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--bd);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 18px;z-index:5}
.logo{font-weight:700;font-size:20px}.logo b{color:var(--cy)}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav button{background:none;border:1px solid var(--bd);color:var(--mu);padding:8px 14px;border-radius:20px;cursor:pointer;font:inherit}
nav button.on{background:var(--cy);color:var(--ink);border-color:var(--cy);font-weight:700}
main{max-width:980px;margin:0 auto;padding:22px 16px 60px}
h2{margin:0 0 6px;font-size:28px}h3{margin:0 0 8px}
.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.btn{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink);background:var(--cy)}
.btn.g{background:var(--gr)}.btn.r{background:var(--rd)}.btn.a{background:var(--am)}.btn.o{background:none;border:1px solid var(--bd);color:var(--tx)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:3px 12px;border-radius:20px;font-size:13px;font-weight:700;border:1px solid}
.low{color:var(--gr)}.mid{color:var(--am)}.high{color:var(--rd)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%}
.big{font-size:72px;font-weight:700;line-height:1}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--bd);font-size:14px}
.phone{max-width:340px;margin:0 auto;text-align:center;border:2px solid var(--cy);border-radius:32px;padding:30px 20px;background:var(--card)}
.ring{width:96px;height:96px;border-radius:50%;background:var(--cy);color:var(--ink);font-size:44px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;animation:p 1s infinite}
@keyframes p{50%{transform:scale(1.12);box-shadow:0 0 0 18px #22d3ee33}}
.sel{border-color:var(--cy)}
</style></head><body>
<header><div class="logo">🛡️ MEDGUARD <b>AI</b> <span class="mu" style="font-weight:400;font-size:14px">live demo · synthetic data</span></div>
<nav id="nav"></nav></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const OPT={
 device:[["Hospital Laptop HL-204",0],["Kali-Linux VM (unknown)",25],["Unregistered Android phone",25]],
 loc:[["Hospital network, Ward 3",0],["Foreign VPN exit node",20],["Public cafe Wi-Fi",20]],
 time:[["10:15 AM",0],["2:47 AM",15]],
 vol:[["5 records",0],["50 records",10],["300+ records",21]],
 purpose:[["Patient treatment",0],["No reason given",8],["Research export",8]],
 sens:[["Routine records",0],["Psychiatric and HIV records",10]]};
const LBL={device:"Device",loc:"Location",time:"Time",vol:"Records requested",purpose:"Purpose",sens:"Data sensitivity"};
const DOC={device:0,loc:0,time:0,vol:0,purpose:0,sens:0};
const HACK={device:1,loc:1,time:1,vol:2,purpose:0,sens:1};
let S={view:"login",mode:"doctor",pick:{...HACK},req:null,access:null,reqs:[],audit:[],sel:null,call:null,mfa:null,stats:{allow:0,verify:0,review:0,deny:0}};
const now=()=>new Date().toLocaleTimeString();
function score(p){let items=[];for(const k in OPT){const o=OPT[k][p[k]];if(o[1])items.push([LBL[k]+": "+o[0],o[1]])}
 const t=Math.min(100,items.reduce((a,b)=>a+b[1],0));return{t,items}}
const lvl=t=>t<=30?["low","Low risk","Allow"]:t<=60?["mid","Medium risk","Verify"]:["high","High risk","Human review"];
const colr=t=>t<=30?"var(--gr)":t<=60?"var(--am)":"var(--rd)";
function log(who,r,dec,by){S.audit.unshift({t:now(),who,r,dec,by})}
function ctxText(p){return Object.keys(OPT).map(k=>OPT[k][p[k]][0]).join(" · ")}
function nav(){const v=[["login","1 · Login portal"],["admin","2 · Admin review ("+S.reqs.filter(r=>r.st=="pending").length+")"],["audit","3 · Audit ledger"]];
 $("#nav").innerHTML=v.map(x=>`<button class="${S.view==x[0]||(S.view=="call"&&x[0]=="admin")?"on":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("")}
function go(v){S.view=v;draw()}
function modeSet(m){S.mode=m;draw()}
function setPick(k,v){S.pick[k]=+v;draw()}
function login(){
 const p=S.mode=="doctor"?DOC:S.pick,sc=score(p),L=lvl(sc.t),who=S.mode=="doctor"?"Dr. Meera Nair":"Dr. Meera Nair (credentials used by attacker)";
 const base={who,p:{...p},sc,at:now()};S.mfa=null;S.access=null;
 if(sc.t<=30){S.stats.allow++;log(who,sc.t,"Allowed automatically","Risk engine");S.access={...base,how:"Allowed automatically"};S.req=null}
 else if(sc.t<=60){S.stats.verify++;log(who,sc.t,"Extra verification required","Risk engine");S.mfa={...base};S.req=null}
 else{S.stats.review++;const r={id:Date.now(),...base,st:"pending",doc:null};S.reqs.unshift(r);S.req=r;log(who,sc.t,"Escalated to human review","Risk engine")}
 draw()}
function mfa(ok){if(!ok){log(S.mfa.who,S.mfa.sc.t,"MFA failed, blocked","User");S.stats.deny++;S.mfa=null;S.req={st:"denied",sc:{t:0},why:"MFA code was wrong"}}
 else{log(S.mfa.who,S.mfa.sc.t,"MFA passed, allowed","User");S.access={...S.mfa,how:"Allowed after MFA"};S.mfa=null}draw()}
function pickReq(id){S.sel=id;draw()}
function callDoc(id){S.call={id,stage:"ring"};S.view="call";draw();setTimeout(()=>{if(S.call&&S.call.id==id){S.call.stage="talk";draw()}},2500)}
function answer(a){const r=S.reqs.find(x=>x.id==S.call.id);r.doc=a;S.call.stage="done";log(r.who,r.sc.t,"Doctor called: "+(a?"confirmed it was them":"said NOT them"),"Admin");draw()}
function decide(id,ok){const r=S.reqs.find(x=>x.id==id);r.st=ok?"approved":"denied";
 log(r.who,r.sc.t,ok?"APPROVED by admin":"DENIED by admin","Admin");if(!ok)S.stats.deny++;
 if(ok&&S.req&&S.req.id==id)S.access={...r,how:"Approved by security admin"};
 S.call=null;S.view="admin";draw()}
function resetAll(){S.req=null;S.access=null;S.mfa=null;draw()}
const badge=t=>{const L=lvl(t);return`<span class="pill ${L[0]}">${L[1]} · ${t}/100</span>`};
function breakdown(sc){return sc.items.length?sc.items.map(i=>`<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><span>${i[0]}</span><b class="high">+${i[1]}</b></div><div class="bar"><i style="width:${i[1]*4}%;background:var(--rd)"></i></div></div>`).join(""):`<p class="low">Everything looks normal. No risk signals.</p>`}
function vLogin(){
 if(S.access)return vPortal();
 if(S.mfa)return`<div class="card"><h2>Extra verification needed</h2><p>${badge(S.mfa.sc.t)} Something looks a little different, so we ask for one more proof.</p><div style="max-width:320px"><label>Enter the 6-digit code sent to your phone <span class="mu">(demo code: 482913)</span></label><input id="otp" placeholder="••••••"><div class="row" style="margin-top:12px"><button class="btn g" onclick="mfa($('#otp').value=='482913')">Verify</button><button class="btn o" onclick="resetAll()">Cancel</button></div></div></div>`;
 if(S.req&&S.req.st=="pending")return`<div class="card" style="text-align:center"><h2>⏳ Waiting for security review</h2><p class="mu">Your password was correct, but this request looks risky.<br>A security admin has been alerted and may phone the real doctor.</p><div class="big high">${S.req.sc.t}</div><p class="mu">risk score</p><div class="row" style="justify-content:center"><button class="btn" onclick="go('admin')">Open Admin page →</button></div></div>`;
 if(S.req&&S.req.st=="denied")return`<div class="card" style="text-align:center;border-color:var(--rd)"><h2 class="high">⛔ Access denied</h2><p>${S.req.why||"The security admin denied this request."} Your attempt was recorded.</p><button class="btn" onclick="resetAll()">Try again</button></div>`;
 if(S.req&&S.req.st=="approved")return vPortal();
 const hk=S.mode=="hacker",p=hk?S.pick:DOC,sc=score(p);
 const dd=hk?`<div class="card" style="border-color:var(--rd)"><h3 class="high">🕵️ Attacker controls</h3><p class="mu" style="margin-top:0">Change the context the attacker logs in from.</p><div class="grid">${Object.keys(OPT).map(k=>`<div><label>${LBL[k]}</label><select onchange="setPick('${k}',this.value)">${OPT[k].map((o,i)=>`<option value="${i}" ${S.pick[k]==i?"selected":""}>${o[0]}</option>`).join("")}</select></div>`).join("")}</div></div>`:"";
 return`<h2>Hospital login portal</h2><p class="mu">Pick who is logging in. The password is always correct. Watch what the context changes.</p>
<div class="row" style="margin-bottom:16px"><button class="btn ${hk?"o":"g"}" onclick="modeSet('doctor')">🩺 Login as Doctor</button><button class="btn ${hk?"r":"o"}" onclick="modeSet('hacker')">🕵️ Login as Hacker</button></div>
<div class="grid"><div class="card"><h3>Sign in</h3><label>Username</label><input value="dr.meera.nair" readonly><label>Password</label><input type="password" value="correct-password" readonly><p class="low" style="margin:10px 0 0">✔ Credentials valid</p><div style="margin-top:14px"><button class="btn" onclick="login()">Log in</button></div></div>
<div class="card"><h3>Live risk preview</h3><div class="row"><div class="big" style="color:${colr(sc.t)}">${sc.t}</div><div>${badge(sc.t)}<p class="mu" style="margin:6px 0 0">Decision: <b>${lvl(sc.t)[2]}</b></p></div></div>${breakdown(sc)}<p class="mu" style="font-size:13px">${hk?"":"Doctor: known laptop, hospital network, 10:15 AM, 5 records."}</p></div></div>${dd}`}
function vPortal(){const a=S.access||{...S.req,how:"Approved by security admin"};
 return`<div class="card" style="border-color:var(--gr)"><div class="row" style="justify-content:space-between"><div><h2 class="low">✅ Access granted</h2><p class="mu" style="margin:0">${a.how} · ${badge(a.sc.t)}</p></div><button class="btn o" onclick="S.access=null;S.req=null;draw()">Log out</button></div></div>
<div class="card"><h3>Patient records (synthetic)</h3><table><tr><th>ID</th><th>Patient</th><th>Ward</th><th>Status</th></tr>${[["P-1001","Synthetic Patient A","Cardiology","Stable"],["P-1002","Synthetic Patient B","Ortho","Recovery"],["P-1003","Synthetic Patient C","General","Observation"],["P-1004","Synthetic Patient D","Neuro","Stable"],["P-1005","Synthetic Patient E","ICU","Critical"]].map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table><p class="mu" style="font-size:13px">Context: ${ctxText(a.p)}</p></div>`}
function vAdmin(){
 const st=S.stats,pend=S.reqs.filter(r=>r.st=="pending");
 const cc=[["Allowed",st.allow,"var(--gr)"],["Verified (MFA)",st.verify,"var(--am)"],["Sent to review",st.review,"var(--cy)"],["Denied",st.deny,"var(--rd)"]];
 const sel=S.reqs.find(r=>r.id==S.sel)||pend[0]||S.reqs[0];
 return`<h2>Security admin console</h2><p class="mu">High-risk requests land here. A human decides.</p><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${cc.map(c=>`<div class="card" style="margin:0"><div class="big" style="font-size:44px;color:${c[2]}">${c[1]}</div><div class="mu">${c[0]}</div></div>`).join("")}</div><div style="height:16px"></div>
${!S.reqs.length?`<div class="card mu">No requests yet. Log in as the hacker on the Login page first.</div>`:`<div class="grid"><div class="card"><h3>Review queue</h3>${S.reqs.map(r=>`<div class="card ${sel&&sel.id==r.id?"sel":""}" style="cursor:pointer;padding:12px;margin-bottom:8px" onclick="pickReq(${r.id})"><div class="row" style="justify-content:space-between"><b>${r.at}</b>${badge(r.sc.t)}</div><div class="mu" style="font-size:13px">${r.st=="pending"?"⏳ pending":r.st=="approved"?"✅ approved":"⛔ denied"}</div></div>`).join("")}</div>
<div class="card"><h3>Request details</h3><p style="margin-top:0">${sel.who}</p><p class="mu" style="font-size:14px">${ctxText(sel.p)}</p>${breakdown(sel.sc)}${sel.doc!==null?`<p>📞 Doctor said: <b class="${sel.doc?"low":"high"}">${sel.doc?"“Yes, that was me.”":"“That was not me!”"}</b></p>`:""}
${sel.st=="pending"?`<div class="row" style="margin-top:12px"><button class="btn a" onclick="callDoc(${sel.id})">📞 Call the doctor</button><button class="btn g" onclick="decide(${sel.id},true)">Approve</button><button class="btn r" onclick="decide(${sel.id},false)">Deny</button></div>`:`<p class="mu">Decision made: ${sel.st}</p>`}</div></div>`}`}
function vCall(){const r=S.reqs.find(x=>x.id==S.call.id),c=S.call;
 return`<div class="phone">${c.stage=="ring"?`<div class="ring">📞</div><h3>Calling Dr. Meera Nair…</h3><p class="mu">Ringing the number on file</p>`:`<div class="ring" style="animation:none;background:var(--gr)">🩺</div><h3>Connected</h3><p class="mu" style="text-align:left;font-size:15px">“Hello Doctor, this is Security. Did you just log in from <b>${OPT.device[r.p.device][0]}</b> at <b>${OPT.time[r.p.time][0]}</b> and request <b>${OPT.vol[r.p.vol][0]}</b>?”</p>`}
${c.stage=="talk"?`<p class="mu" style="font-size:13px">Choose how the doctor replies (demo):</p><div class="row" style="justify-content:center"><button class="btn g" onclick="answer(true)">“Yes, me”</button><button class="btn r" onclick="answer(false)">“Not me!”</button></div>`:""}
${c.stage=="done"?`<p>Doctor said: <b class="${r.doc?"low":"high"}">${r.doc?"“Yes, that was me.”":"“No, that was not me!”"}</b></p><p class="mu" style="font-size:14px">${r.doc?"Safe to approve.":"Credentials were stolen. Deny now."}</p><div class="row" style="justify-content:center"><button class="btn g" onclick="decide(${r.id},true)">Approve</button><button class="btn r" onclick="decide(${r.id},false)">Deny</button></div>`:""}
<div style="margin-top:14px"><button class="btn o" onclick="S.call=null;go('admin')">Hang up</button></div></div>`}
function vAudit(){return`<h2>Audit ledger</h2><p class="mu">Every decision leaves evidence.</p><div class="card">${S.audit.length?`<table><tr><th>Time</th><th>Account</th><th>Risk</th><th>Decision</th><th>By</th></tr>${S.audit.map(a=>`<tr><td>${a.t}</td><td>${a.who}</td><td class="${lvl(a.r)[0]}">${a.r}</td><td>${a.dec}</td><td>${a.by}</td></tr>`).join("")}</table>`:`<p class="mu">Nothing yet. Try a login.</p>`}</div>`}
function draw(){nav();$("#app").innerHTML=S.view=="login"?vLogin():S.view=="admin"?vAdmin():S.view=="call"?vCall():vAudit();window.scrollTo(0,0)}
draw();
</script></body></html>
